# Builds the Quest app (an APK you can install on the headset) on GitHub, so no PC is needed.
# Runs on every push to main or the working branch, or by hand from the Actions tab ("Run workflow").
# The finished APKs are attached to the "quest-latest" release (the newest build always replaces it) and to the run itself.
#
# tools/debug.keystore is an ordinary debug-style signing key, committed on purpose: with the same key every build can be
# installed over the last one. It is fine for sideloading to your own headset; a store release would need a private key.
name: Build Quest APK

on:
  push:
    branches: [main, ccr-a7572bf4-a4071g]
    paths-ignore: ['tests/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-quest
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  VENDORS_VERSION: 4.3.1-stable
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/debug.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # Godot's Android build wants exactly Java 17

      - name: Android SDK pieces Godot 4.4 needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null

      - name: Godot and its Android export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/android_*' templates/version.txt -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          SETTINGS

      - name: Check the game logic
        run: |
          godot --headless --import || true
          godot --headless -s res://tests/vr_logic.gd
          godot --headless -s res://tests/hands_logic.gd
          godot --headless -s res://tests/hub_logic.gd
          godot --headless -s res://tests/level_switch.gd
          godot --headless -s res://tests/score_logic.gd
          godot --headless -s res://tests/watch_logic.gd
          godot --headless -s res://tests/run_logic.gd
          godot --headless -s res://tests/grind_logic.gd
          godot --headless -s res://tests/bump_logic.gd

      - name: OpenXR Vendors plugin (the Meta Quest loader)
        run: |
          # unpacked outside the project: a second copy inside it would make Godot load the plugin twice
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vendors.zip" "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}/godotopenxrvendorsaddon.zip"
          unzip -q "$RUNNER_TEMP/vendors.zip" 'asset/addons/godotopenxrvendors/*' -d "$RUNNER_TEMP/vendors"
          mkdir -p addons
          cp -r "$RUNNER_TEMP/vendors/asset/addons/godotopenxrvendors" addons/

      - name: Android build template
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo -n "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Build the APKs
        run: |
          # each build gets a higher version number, so it installs as an update
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          godot --headless --import || true
          mkdir -p build
          godot --headless --export-release "Quest" build/skatepark.apk
          ls -la build
          test -s build/skatepark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skatepark-quest-apk
          path: build/*.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete quest-latest --yes --cleanup-tag || true
          gh release create quest-latest build/skatepark.apk \
            --prerelease --target "$GITHUB_SHA" --title "Quest build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}. skatepark.apk is the one to install."
